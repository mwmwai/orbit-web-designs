<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3.5in" height="2in" viewBox="0 0 1050 600">
  <defs>
    <linearGradient id="electricNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#2f7bff"/>
    </linearGradient>
    <linearGradient id="electricNeonVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#2f7bff"/>
    </linearGradient>
    <style><![CDATA[
      .bg { fill: #101018; }
      .font-main { font-family: Inter, system-ui, sans-serif; }
      .logo-img { filter: drop-shadow(0 0 12px rgba(0,200,255,0.25)); }
      .wordmark { font-size: 42px; font-weight: 800; fill: #ffffff; letter-spacing: 0.42em; }
      .descriptor { font-size: 14px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.34em; text-transform: uppercase; }
      .corner-text { font-size: 12px; font-weight: 500; fill: #64748b; letter-spacing: 0.18em; }
      .hook { font-size: 22px; font-weight: 800; fill: #ffffff; letter-spacing: 0.02em; }
      .contact-text { font-size: 16px; fill: #cbd5e1; }
      .services { font-size: 16px; font-weight: 700; fill: #cbd5e1; letter-spacing: 0.09em; text-transform: uppercase; }
      .tag { font-size: 14px; fill: #64748b; letter-spacing: 0.06em; }
      .icon { fill: #00c8ff; }
    ]]></style>
  </defs>

  <!-- ===== FRONT CARD (page 1) ===== -->
  <g id="front-card">
    <!-- Background -->
    <rect class="bg" width="1050" height="600" rx="0"/>

    <!-- Logo lockup (centered) -->
    <g id="front-logo" transform="translate(525, 260)">
      <!-- Orbit mark (inline vector) -->
      <g transform="translate(-60, -60)">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="120" y2="120">
            <stop offset="0%" stop-color="#00c8ff"/>
            <stop offset="100%" stop-color="#2f7bff"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="50" fill="none" stroke="url(#logoGrad)" stroke-width="4"/>
        <ellipse cx="60" cy="60" rx="50" ry="20" fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.55" transform="rotate(-24 60 60)"/>
        <circle cx="60" cy="60" r="13" fill="url(#logoGrad)"/>
        <circle cx="97" cy="28" r="6" fill="#00c8ff"/>
      </g>
      <!-- ORBIT wordmark -->
      <text class="font-main wordmark" x="0" y="90" text-anchor="middle" dominant-baseline="middle" style="text-indent: 0.42em;">ORBIT</text>
      <!-- Descriptor -->
      <text class="font-main descriptor" x="0" y="128" text-anchor="middle" dominant-baseline="middle" style="text-indent: 0.34em;">WEB DESIGNS & MARKETING</text>
    </g>

    <!-- Bottom corner texts -->
    <text class="font-main corner-text" x="50" y="560" text-anchor="start" dominant-baseline="middle">ORBITWEBDESIGNS.CO.KE</text>
    <text class="font-main corner-text" x="1000" y="560" text-anchor="end" dominant-baseline="middle">POWERING LOCAL GROWTH</text>
  </g>

  <!-- ===== BACK CARD (page 2) ===== -->
  <g id="back-card" transform="translate(0, 600)">
    <!-- Background -->
    <rect class="bg" width="1050" height="600" rx="0"/>

    <!-- Hook heading -->
    <text class="font-main hook" x="60" y="90" dominant-baseline="middle">Get Your Business Online</text>

    <!-- Contacts -->
    <g id="contacts" font-family="Inter, system-ui, sans-serif">
      <!-- Website -->
      <g transform="translate(60, 150)">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <text class="contact-text" x="32" y="14" dominant-baseline="middle">
          <a href="https://orbitwebdesigns.co.ke" style="text-decoration:none;fill:#cbd5e1;">www.orbitwebdesigns.co.ke</a>
        </text>
      </g>

      <!-- Phone / WhatsApp -->
      <g transform="translate(60, 210)">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9z"/>
        </svg>
        <text class="contact-text" x="32" y="14" dominant-baseline="middle">+254 741 992 308 · WhatsApp</text>
      </g>

      <!-- Email -->
      <g transform="translate(60, 270)">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-10 6L2 7"/>
        </svg>
        <text class="contact-text" x="32" y="14" dominant-baseline="middle">
          <a href="mailto:mwmwai@gmail.com" style="text-decoration:none;fill:#cbd5e1;">mwmwai@gmail.com</a>
        </text>
      </g>
    </g>

    <!-- Services line -->
    <text class="font-main services" x="60" y="360" dominant-baseline="middle">Custom Websites · Speed Optimisation · Marketing</text>

    <!-- Tagline -->
    <text class="font-main tag" x="60" y="410" dominant-baseline="middle">Orbit Web Designs — Powering Local Growth</text>
  </g>
</svg>