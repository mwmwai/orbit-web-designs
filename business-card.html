<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit Web Designs &amp; Marketing — Business Card</title>
<style>
	:root {
		--ink: #0a0a0f;
		--panel: #101018;
		--edge: #23233a;
		--electric: #00c8ff;
		--neon: #2f7bff;
	}

	* { margin: 0; padding: 0; box-sizing: border-box; }

	body {
		background: var(--ink);
		color: #e7e9f2;
		font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 48px;
		padding: 56px 20px;
		-webkit-font-smoothing: antialiased;
	}

	header { text-align: center; }
	header p.label {
		font-size: 11px;
		font-weight: 600;
		letter-spacing: 0.35em;
		text-transform: uppercase;
		color: #64748b;
	}
	header h1 {
		margin-top: 10px;
		font-size: 22px;
		font-weight: 800;
		color: #fff;
	}
	header p.sub { margin-top: 8px; font-size: 13px; color: #94a3b8; }
	header button {
		margin-top: 18px;
		border: 0;
		cursor: pointer;
		border-radius: 999px;
		padding: 10px 26px;
		font-size: 13px;
		font-weight: 700;
		color: var(--ink);
		background: linear-gradient(90deg, var(--electric), var(--neon));
	}
	header button:hover { opacity: 0.9; }

	.card {
		position: relative;
		width: 3.5in;
		height: 2in;
		flex-shrink: 0;
		overflow: hidden;
		border-radius: 14px;
		background: var(--panel);
		box-shadow:
			0 30px 60px -20px rgba(0, 0, 0, 0.7),
			0 0 0 1px rgba(255, 255, 255, 0.03);
	}
	@media screen and (max-width: 480px) {
		.card { transform: scale(0.92); transform-origin: top center; }
	}

	.sheen {
		position: absolute;
		inset: 0;
		background:
			linear-gradient(115deg,
				rgba(255, 255, 255, 0.06) 0%,
				transparent 28%,
				transparent 72%,
				rgba(0, 200, 255, 0.05) 100%);
		pointer-events: none;
	}

	/* ---------- FRONT ---------- */
	.front .glow {
		position: absolute;
		inset: 0;
		background: radial-gradient(2.3in 1.4in at 18% 108%, rgba(0, 200, 255, 0.14), transparent 65%);
		pointer-events: none;
	}
	.front .inner {
		position: relative;
		z-index: 1;
		height: 100%;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
	}
	.front .logo {
		width: 2.15in;
		height: auto;
		display: block;
	}
	.front .rule {
		width: 62px;
		height: 1px;
		margin-top: 14px;
		background: linear-gradient(90deg, transparent, var(--electric), transparent);
	}
	.front .url {
		position: absolute;
		bottom: 13px;
		left: 0;
		right: 0;
		text-align: center;
		font-size: 8px;
		font-weight: 500;
		letter-spacing: 0.22em;
		color: #64748b;
	}

	/* ---------- BACK ---------- */
	.back .accent {
		position: absolute;
		top: 0; left: 0; right: 0;
		height: 2px;
		background: linear-gradient(90deg, var(--electric), var(--neon) 55%, transparent);
	}
	.back .rings {
		position: absolute;
		right: -0.55in;
		bottom: -0.75in;
		width: 1.9in;
		height: 1.9in;
		opacity: 0.12;
		pointer-events: none;
	}
	.back .inner {
		position: relative;
		z-index: 1;
		height: 100%;
		display: flex;
		flex-direction: column;
		padding: 0.26in 0.28in;
	}
	.back .brand {
		display: flex;
		align-items: center;
	}
	.back .brand-logo {
		width: 1.05in;
		height: auto;
		display: block;
	}
	.back ul {
		list-style: none;
		margin-top: auto;
		display: flex;
		flex-direction: column;
		gap: 7px;
		font-size: 9px;
		color: #cbd5e1;
	}
	.back li { display: flex; align-items: center; gap: 10px; letter-spacing: 0.02em; }
	.back a { color: inherit; text-decoration: none; }
	.back svg { flex-shrink: 0; }

	/* ---------- PRINT: one card per page ---------- */
	@media print {
		@page { size: 3.5in 2in; margin: 0; }
		body { background: var(--panel); padding: 0; gap: 0; display: block; }
		header { display: none; }
		.card {
			border-radius: 0;
			box-shadow: none;
			break-after: page;
			page-break-after: always;
		}
		.card:last-child { break-after: auto; page-break-after: auto; }
	}
</style>
</head>
<body>

<header>
	<p class="label">Brand Stationery</p>
	<h1>Orbit Business Card</h1>
	<p class="sub">Standard CR80 &middot; 3.5 &times; 2 in &middot; duplex front / back &middot; print at 100% scale</p>
	<button type="button" onclick="window.print()">Print / Save PDF</button>
</header>

<!-- FRONT -->
<section class="card front" aria-label="Card front">
	<div class="sheen"></div>
	<div class="glow"></div>
	<div class="inner">
		<svg width="52" height="52" viewBox="0 0 48 48" fill="none" aria-hidden="true">

			<ellipse cx="24" cy="24" rx="20" ry="8" stroke="url(#og)" stroke-width="1.1" opacity="0.55" transform="rotate(-24 24 24)"/>
			<circle cx="24" cy="24" r="5.2" fill="url(#og)"/>
			<circle cx="41.5" cy="15.5" r="2.4" fill="#00c8ff"/>
		</svg>
		<div class="wordmark">ORBIT</div>
		<div class="descriptor">Web Designs &amp; Marketing</div>
		<div class="rule"></div>
		<div class="url">ORBITWEBDESIGNS.CO.KE</div>
	</div>
</section>

			<ellipse cx="24" cy="24" rx="20" ry="8" stroke="#00c8ff" stroke-width="0.6" transform="rotate(-24 24 24)"/>
		</svg>
	</div>
	<div class="inner">
		<div class="brand">
			<svg width="18" height="18" viewBox="0 0 48 48" fill="none" aria-hidden="true">
				<defs>
					<linearGradient id="obg" x1="0" y1="0" x2="48" y2="48">
						<stop offset="0" stop-color="#00c8ff"/>
						<stop offset="1" stop-color="#2f7bff"/>
					</linearGradient>
				</defs>
				<circle cx="24" cy="24" r="19" stroke="url(#obg)" stroke-width="2"/>
				<circle cx="24" cy="24" r="6" fill="url(#obg)"/>
			</svg>
			<span>ORBIT</span>
		</div>
		<ul>
			<li>
				<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9z"/></svg>
				<a href="tel:+254741992308">+254 741 992 308</a>
			</li>
			<li>
				<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
				<a href="mailto:mwmwai@gmail.com">mwmwai@gmail.com</a>
			</li>
			<li>
				<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
				<a href="https://orbitwebdesigns.co.ke">orbitwebdesigns.co.ke</a>
			</li>
			<li>
				<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>

			</li>
		</ul>
	</div>
</section>

</body>
</html>
