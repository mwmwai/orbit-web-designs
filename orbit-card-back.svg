<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="2in" viewBox="0 0 1050 600">
  <defs>
    <style>
      .font-main { font-family: Inter, system-ui, sans-serif; }
      .hook { font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
      .contact { font-size: 16px; fill: #cbd5e1; letter-spacing: 0.4px; }
      .services { font-size: 15px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.6px; }
      .tag { font-size: 13px; fill: #64748b; letter-spacing: 1px; }
      .icon { stroke: #00c8ff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .bg { fill: #101018; }
    </style>
  </defs>

  <rect class="bg" width="1050" height="600"/>

  <!-- Heading -->
  <text class="font-main hook" x="60" y="105">Get Your Business Online</text>

  <!-- Contact rows -->
  <g transform="translate(60, 165)">
    <!-- Globe icon -->
    <g class="icon" transform="translate(0, -11)">
      <circle cx="10" cy="10" r="9"/>
      <path d="M1 10h18M10 1a14 14 0 0 1 3.6 9A14 14 0 0 1 10 19 14 14 0 0 1 6.4 10 14 14 0 0 1 10 1z"/>
    </g>
    <text class="font-main contact" x="34" y="4">www.orbitwebdesigns.co.ke</text>
  </g>

  <g transform="translate(60, 225)">
    <!-- Phone icon -->
    <g class="icon" transform="translate(1, -10) scale(0.85)">
      <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9z"/>
    </g>
    <text class="font-main contact" x="34" y="4">+254 741 992 308 · WhatsApp</text>
  </g>

  <g transform="translate(60, 285)">
    <!-- Mail icon -->
    <g class="icon" transform="translate(0, -10)">
      <rect x="1" y="3" width="18" height="14" rx="2"/>
      <path d="m19 5-9 5.5L1 5"/>
    </g>
    <text class="font-main contact" x="34" y="4">mwmwai@gmail.com</text>
  </g>

  <!-- Services -->
  <text class="font-main services" x="60" y="420">CUSTOM WEBSITES · SPEED OPTIMISATION · MARKETING</text>

  <!-- Tagline -->
  <text class="font-main tag" x="60" y="465">Orbit Web Designs — Powering Local Growth</text>
