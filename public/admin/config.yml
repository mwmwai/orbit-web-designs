backend:
  name: github
  repo: mwmwai/orbit-web-designs
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: api/v1/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General"
        file: "src/data/site.json"
        fields:
          - {label: "Site Name", name: "siteName", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Phone Display", name: "phone", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
      - name: "pricing"
        label: "Pricing"
        file: "src/data/pricing.json"
        fields:
          - label: "Plans"
            name: "plans"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Blurb", name: "blurb", widget: "string"}
              - {label: "Features", name: "features", widget: "list"}
  - name: "services"
    label: "Services"
    folder: "src/data/services"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Body", name: "body", widget: "markdown"}
