<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flick Studio</title>
<style>
  :root { --bg:#070B1C; --card:#121A33; --line:#243055; --amber:#F59E0B; --text:#F8FAFC; --muted:#9FB2D8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background: radial-gradient(1200px 800px at 50% 0%, #101736 0%, var(--bg) 70%); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; min-height:100vh; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 48px; }
  header { text-align:center; padding:18px 0 10px; }
  h1 { font-size:28px; font-weight:900; letter-spacing:6px; }
  h1 span { color:var(--amber); }
  .sub { color:var(--muted); font-size:14px; margin-top:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  label { display:block; font-size:13px; font-weight:700; color:var(--muted); margin:12px 0 6px; letter-spacing:1px; }
  label:first-child { margin-top:0; }
  input, textarea { width:100%; background:#0B1128; border:1px solid var(--line); color:var(--text); border-radius:12px; padding:13px 14px; font-size:16px; outline:none; }
  input:focus, textarea:focus { border-color:var(--amber); }
  textarea { resize:vertical; min-height:64px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { width:100%; margin-top:18px; background:linear-gradient(135deg,#F59E0B,#FBCE3A); color:#0B1026; font-size:18px; font-weight:800; border:none; border-radius:14px; padding:16px; cursor:pointer; }
  button:disabled { opacity:.55; }
  .status { text-align:center; color:var(--muted); font-size:15px; margin-top:14px; min-height:22px; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--amber); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-3px; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg);} }
  video { width:100%; max-width:340px; display:block; margin:14px auto 0; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  a.dl { display:block; text-align:center; margin-top:12px; color:var(--amber); font-weight:700; text-decoration:none; font-size:16px; }
  .post { background:#0B1128; border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; font-size:14px; white-space:pre-wrap; color:#DDE6FA; position:relative; }
  .post b { color:var(--amber); display:block; margin-bottom:6px; letter-spacing:1px; font-size:12px; }
  .copy { position:absolute; top:8px; right:8px; background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:8px; font-size:11px; padding:4px 8px; margin:0; width:auto; }
  details summary { color:var(--muted); font-size:13px; cursor:pointer; margin-top:14px; }
  .err { color:#F87171; text-align:center; margin-top:12px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FLICK <span>STUDIO</span></h1>
    <div class="sub">Paste your script. Get a full video + posts.</div>
  </header>

  <div class="card">
    <label>YOUR SCRIPT — ONE LINE PER SCENE (UP TO 5)</label>
    <textarea id="l1" placeholder="Hook line..."></textarea>
    <textarea id="l2" placeholder="Problem line..." style="margin-top:10px"></textarea>
    <textarea id="l3" placeholder="Solution line..." style="margin-top:10px"></textarea>
    <textarea id="l4" placeholder="Proof / features line..." style="margin-top:10px"></textarea>
    <textarea id="l5" placeholder="Call to action line..." style="margin-top:10px"></textarea>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>BRAND NAME</label><input id="brandName" value="Orbit Web Designs" /></div>
      <div><label>BRAND SUB</label><input id="brandSub" value="Web Designs" /></div>
      <div><label>TAGLINE</label><input id="tagline" value="Your brand, in motion." /></div>
      <div><label>WEBSITE</label><input id="url" value="orbitwebdesigns.co.ke" /></div>
      <div><label>SCENE 1 TITLE</label><input id="hook" value="Your first impression" /></div>
      <div><label>LOCATION TAG</label><input id="location" value="Nairobi" /></div>
    </div>
    <details>
      <summary>More scene text options</summary>
      <div class="grid" style="margin-top:10px">
        <div><label>COUNTDOWN LABEL</label><input id="label" value="3 SECONDS" /></div>
        <div><label>HERO TEXT</label><input id="hero" value="Websites that work." /></div>
        <div><label>BUTTON TEXT</label><input id="cta" value="Get started" /></div>
      </div>
    </details>

    <div class="grid" style="margin-top:14px">
      <div>
        <label>VOICEOVER VOICE</label>
        <select id="voice" style="width:100%; background:#0B1128; border:1px solid var(--line); color:var(--text); border-radius:12px; padding:13px 14px; font-size:16px;">
          <option value="en-US-AndrewNeural">Andrew - US male, ElevenLabs-style (default)</option>
          <option value="en-US-AriaNeural">Aria - US female</option>
          <option value="en-US-BrianMultilingualNeural">Brian - US male, deep</option>
          <option value="en-US-EmmaMultilingualNeural">Emma - US female, warm</option>
          <option value="en-GB-RyanNeural">Ryan - British male</option>
          <option value="en-GB-SoniaNeural">Sonia - British female</option>
          <option value="en-KE-AsiliaNeural">Asilia - Kenyan female</option>
          <option value="en-KE-ChilembaNeural">Chilemba - Kenyan male</option>
        </select>
      </div>
      <div>
        <label>NARRATION</label>
        <button id="voiceToggle" type="button" style="margin-top:0; background:#0B1128; color:var(--amber); border:1px solid var(--amber); font-size:15px;">Voice: ON</button>
      </div>
    </div>

    <button id="go">Generate Video</button>
    <div class="status" id="status"></div>
    <div class="err" id="err"></div>
    <video id="player" controls playsinline style="display:none"></video>
    <a class="dl" id="dl" style="display:none" download="flick-video.mp4">Download MP4</a>
    <div id="posts"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let voiceOn = true;
$('voiceToggle').onclick = () => {
  voiceOn = !voiceOn;
  $('voiceToggle').textContent = 'Voice: ' + (voiceOn ? 'ON' : 'OFF');
};
$('go').onclick = async () => {
  $('err').textContent = '';
  $('posts').innerHTML = '';
  $('player').style.display = 'none';
  $('dl').style.display = 'none';
  $('go').disabled = true;
  const body = {
    lines: [$('l1').value, $('l2').value, $('l3').value, $('l4').value, $('l5').value],
    brandName: $('brandName').value, brandSub: $('brandSub').value,
    tagline: $('tagline').value, url: $('url').value,
    hook: $('hook').value, location: $('location').value,
    label: $('label').value, hero: $('hero').value, cta: $('cta').value,
    voice: $('voice').value, voiceover: voiceOn,
  };
  const res = await fetch('/api/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const {id} = await res.json();
  const tick = setInterval(async () => {
    const s = await (await fetch('/api/status/' + id)).json();
    $('status').innerHTML = s.done ? '' : '<span class="spinner"></span>' + (s.status || 'Working...');
    if (s.error) { clearInterval(tick); $('go').disabled = false; $('err').textContent = 'Failed: ' + s.error; }
    else if (s.done) {
      clearInterval(tick);
      $('go').disabled = false;
      $('status').textContent = '';
      $('player').src = `/video/${id}/full.mp4`;
      $('player').style.display = 'block';
      $('dl').href = `/video/${id}/full.mp4`;
      $('dl').style.display = 'block';
      for (const [platform, text] of Object.entries(s.posts)) {
        const div = document.createElement('div');
        div.className = 'post';
        const btn = document.createElement('button');
        btn.className = 'copy'; btn.textContent = 'Copy';
        btn.onclick = () => { navigator.clipboard.writeText(text); btn.textContent = 'Copied'; setTimeout(()=>btn.textContent='Copy', 1200); };
        div.appendChild(btn);
        const b = document.createElement('b'); b.textContent = platform.toUpperCase(); div.appendChild(b);
        div.appendChild(document.createTextNode(text));
        $('posts').appendChild(div);
      }
    }
  }, 3000);
};
</script>
</body>
</html>
